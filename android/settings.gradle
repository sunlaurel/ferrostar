pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

includeBuild('../../valhalla_bindings/android') {
    dependencySubstitution {
        // substitutes the published jni bindings with the local binding module
        substitute module('io.github.rallista:valhalla-mobile') using project(':valhalla')
    }
}

rootProject.name = 'Ferrostar'
include ':core'
include ':valhalla-service'
include ':ui-compose'
include ':demo-app'
include ':ui-maplibre'
include ':google-play-services'
include ':ui-formatters'
include ':ui-shared'
include ':ui-maplibre-car-app'
include ':car-app'
